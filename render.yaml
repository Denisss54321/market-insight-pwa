services:
  - type: web
    name: market-insight-pwa-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    workingDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-insight-pwa-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: MI_STALCRAFT_API_BASE
        value: https://eapi.stalcraft.net
      - key: MI_REGION
        value: RU
      - key: MI_REQUESTS_PER_MINUTE
        value: 45
      - key: MI_HOT_INTERVAL_SECONDS
        value: 45
      - key: MI_WARM_INTERVAL_SECONDS
        value: 300
      - key: MI_COLD_INTERVAL_SECONDS
        value: 3600
      - key: MI_HOT_ITEMS
        value: 20
      - key: MI_WARM_ITEMS
        value: 40
      - key: MI_CORS_ORIGINS
        value: https://market-insight-pwa.vercel.app,http://localhost:3000
      - key: MI_STALCRAFT_CLIENT_ID
        value: YOUR_CLIENT_ID
      - key: MI_STALCRAFT_CLIENT_SECRET
        value: YOUR_CLIENT_SECRET
      - key: MI_STALCRAFT_API_TOKEN
        value: YOUR_API_TOKEN

databases:
  - name: market-insight-pwa-db
    databaseName: market_insight_pwa
    user: market_insight_user
    plan: free
